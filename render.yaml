services:
  # Backend Web Service (FastAPI) - Free Tier
  - type: web
    name: minierp-backend
    runtime: python
    plan: free
    buildCommand: pip install -r erp/backend/requirements.txt
    startCommand: cd erp/backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.10.12

  # Frontend Static Site (React / Vite) - Free Tier
  - type: web
    name: minierp-frontend
    runtime: static
    plan: free
    buildCommand: cd erp/frontend && npm install && npm run build
    staticPublishPath: erp/frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: minierp-backend
          property: host
